<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Accounts Marketplace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="login-container">
            <div class="logo-section">
                <img src="./images/logo.png" class="logo">
                <p class="tagline">Your Marketplace for Trusted Game Accounts</p>
            </div>

            <p class="register-para">don’t have an account yet?<a href="#"> Register now</a></p>

            <form class="user-account-form">
                <input type="text" id="username" name="username" placeholder="Username">
                <input type="password" id="password" name="password" placeholder="Password">
                <a href="#">forgot password?</a>
                <button type="submit" class="login" id="login">LOGIN</button>
            </form>

            <p class="sign-para">sign up with</p>

            <div class="social-accounts">
                <div class="social"><img src="./images/logos_facebook.png"></div>
                <div class="social"><img src="./images/material-icon-theme_google.png"></div>
                <div class="social"><img src="./images/skill-icons_discord.png"></div>
                <div class="social"><img src="./images/skill-icons_instagram.png"></div>
                <div class="social"><img src="./images/Vector.png"></div>
            </div>
        </div>
    </main>

    <footer>
        <p>Developer Contact</p>
        <p>jeffcarandang5@gmail.com</p>
    </footer>
    <script src="index.js"></script>
</body>
</html>
